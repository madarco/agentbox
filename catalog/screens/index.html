<!doctype html>
<!-- The gallery's page. `pnpm screens` fills in the data from catalog.mjs and
     setups.mjs (and frame() from scripts/frame.mjs) and writes index.html next
     to this file. Edit this file, not index.html. Mirrors the ControlClaw
     screens gallery (ControlClaw/marketing/ai-videos/screens/). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBox screens</title>
<style>
:root {
  --bg: #fafaf7; --bg2: #f3f2ed; --surface: #fff; --ink: #0d1117; --ink2: #3b4252;
  --muted: #6b7280; --line: #e7e4dc; --brand: #128a4f;
  --brand-soft: #eaf4ee; --code: #f3f2ed; --shade: rgb(13 17 23 / 0.5);
  --y: 86px; /* where a flow line meets a node: its label and half its picture */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216; --bg2: #171a20; --surface: #1b1e25; --ink: #e9eaee; --ink2: #c3c7d0;
    --muted: #949ba8; --line: #2b2f39; --brand: #4cc185;
    --brand-soft: #173a29; --code: #12141a; --shade: rgb(0 0 0 / 0.65);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code, pre { font: 12px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; }

header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; }
header .count { color: var(--muted); }
header input { flex: 1; min-width: 180px; max-width: 420px; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface); }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
.tabs button { border: 0; background: var(--surface); padding: 7px 14px; }
.tabs button[aria-pressed="true"] { background: var(--brand); color: #fff; }

main { padding: 8px 20px 60px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 28px 0 10px; }
h2 small { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 400; margin-left: 6px; }
.empty { color: var(--muted); padding: 40px 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { display: block; width: 100%; height: 100%; padding: 0; text-align: left; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card:hover, .card:focus-visible { border-color: var(--brand); outline: none; }
.card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top left;
  background: var(--bg2); border-bottom: 1px solid var(--line); }
.card .t { display: block; padding: 8px 10px 2px; font-weight: 600; }
.card .m { display: block; padding: 0 10px 9px; color: var(--muted); font-size: 12px; }
.card .ph, .stage .ph { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 10; padding: 12px; color: var(--muted);
  font-size: 12px; text-align: center; background: var(--bg2); border-bottom: 1px solid var(--line); }
.stage .ph { aspect-ratio: auto; height: 100%; border: 0; font-size: 14px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 9px; }
.badge { padding: 1px 6px; border: 1px solid var(--line); border-radius: 99px; font-size: 11px; color: var(--muted); }
.badge.simple { border-color: var(--brand); color: var(--brand); }
#scn { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }

/* The flow: a tree that grows to the right. */
.flow { overflow-x: auto; padding-bottom: 20px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree li { display: flex; align-items: flex-start; position: relative; }
.tree li > ul { margin-left: 56px; }
.tree ul > li::before { content: ""; position: absolute; left: -28px; top: 0; bottom: 0; border-left: 1px solid var(--muted); }
.tree ul > li:first-child::before { top: var(--y); }
.tree ul > li:last-child::before { bottom: auto; height: var(--y); }
.tree ul > li:only-child::before { display: none; }
.tree ul > li::after { content: ""; position: absolute; left: -28px; width: 28px; top: var(--y); border-top: 1px solid var(--muted); }
.node { position: relative; flex: none; width: 200px; margin-bottom: 14px; }
.node.kids::after { content: ""; position: absolute; right: -28px; width: 28px; top: var(--y); border-top: 1px solid var(--muted); }
.node .via { display: flex; align-items: flex-end; height: 34px; padding-bottom: 4px; font-size: 11.5px; line-height: 1.25;
  color: var(--brand); overflow: hidden; }
.node .via span { width: 100%; }
.node .card { height: auto; }
.node .card img { height: 104px; aspect-ratio: auto; }
.node.dim { opacity: 0.25; }

dialog { width: min(1500px, 96vw); height: 92vh; padding: 0; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); }
dialog::backdrop { background: var(--shade); }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100%; }
.stage { display: flex; flex-direction: column; min-width: 0; background: var(--bg2); border-right: 1px solid var(--line); }
.stage .pic { flex: 1; min-height: 0; overflow: auto; padding: 16px; text-align: center; }
.stage .pic img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.stage .pic.fit img { max-height: calc(92vh - 96px); }
.frames { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; border-top: 1px solid var(--line); }
.frames button { flex: none; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  padding: 4px 9px; font-size: 12px; white-space: nowrap; }
.frames button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.info { overflow: auto; padding: 18px 20px 30px; }
.info h3 { font-size: 18px; margin: 0 28px 4px 0; }
.info .topic { color: var(--muted); font-size: 12px; }
.info h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 20px 0 6px; }
.info p { margin: 6px 0; }
.info ol, .info ul { margin: 6px 0; padding-left: 20px; }
.info li { margin: 3px 0; }
.info pre { margin: 6px 0; padding: 8px 10px; background: var(--code); border: 1px solid var(--line); border-radius: 6px;
  white-space: pre-wrap; word-break: break-word; }
.info details { margin: 6px 0; }
.info summary { cursor: pointer; color: var(--brand); }
.path { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.path code { flex: 1; min-width: 0; padding: 5px 8px; background: var(--code); border: 1px solid var(--line);
  border-radius: 6px; overflow-x: auto; white-space: nowrap; }
.copy { flex: none; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 4px 8px; font-size: 12px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.crumbs button { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 3px 8px; font-size: 12px; }
.crumbs span { color: var(--brand); font-size: 12px; }
.warn { color: oklch(0.58 0.19 25); }
.social { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
.card img { background: repeating-conic-gradient(var(--bg2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); }
@media (max-width: 900px) {
  dialog { height: 96vh; }
  .detail { grid-template-columns: 1fr; grid-template-rows: 45% 1fr; }
  .stage { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>

, and shoot warns \"answered 404\". Add it to fixtures/api.mjs.","The hub reads the clock in the browser: shoot pins it to NOW in fixtures/acme.mjs, so \"3m ago\" is the same on every run."]},"fixture-tray":{"title":"Tray app in fixture mode (AgentBoxE2E.app --fixtures)","what":"A second tray instance from ../agentbox-tray (own bundle id and process name, so the owner's real tray is never touched), launched with --fixtures: the tray's in-memory FixtureBoxSource, the same Acme story as the hub fixtures, no hub, no shell-outs. Driven through Accessibility by e2e/tray-driver.","commands":["cd ../../agentbox-tray && make e2e-app            # builds AgentBoxE2E.app (after a tray change)","cd ../e2e/tray-driver && swift build -c release   # the AX driver, once","pnpm shoot:tray \u003cfile> [--press \u003cax id>]...       # launches the app itself when it is not running"],"notes":["Opening a menu takes the screen for a moment: shoot:tray waits until the Mac has had 3s without input. Don't use the Mac while it runs.","Captures are `screencapture -l \u003cwindow id>` of the app's own windows, never a screen region, so nothing else on the screen gets in.","The terminal that runs it needs Screen Recording and Accessibility permission (System Settings → Privacy & Security).","The tray's demo data lives in the tray repo (Sources/AgentBox/Source/FixtureBoxSource.swift), not here. Keep fixtures/acme.mjs in step with it."]},"fixture-cli":{"title":"CLI in a PTY, HOME pointed at the fixture hub","what":"apps/cli/dist/index.js run in the repo's PTY harness (`pnpm drive`) with HOME=.cache/cli-home, whose config sets relay.port to 3126: every hub-backed command reads the fixture hub. The rendered screen, colours included, is drawn into a terminal window by scripts/shoot-cli.mjs.","commands":["pnpm --filter agentbox build   # from the repo root, when the CLI changed","pnpm fixture-hub               # leave it running","pnpm shoot:cli \u003cfile> [options] -- \u003cagentbox args>"],"notes":["The prompt line (\"~/Projects/commerce ❯ agentbox ...\") is drawn, not typed.","Checks that read the real machine (the system compatibility step of the wizard) show this Mac's result."]},"web-dev":{"title":"The public site (apps/web) in next dev","what":"apps/web served by `next dev` on 127.0.0.1:3140, shot with the same scripts/shoot.mjs via --base. /s/example renders a share from the usage-view design fixture, so it needs no database.","commands":["cd ../apps/web && npx next dev -p 3140 -H 127.0.0.1   # leave it running","pnpm shoot web/share-page.png /s/example --base http://127.0.0.1:3140 --full --hide nextjs-portal"],"notes":["--hide nextjs-portal drops the Next dev-mode badge."]},"docs-site":{"title":"Taken for the public docs (apps/web)","what":"Real screenshots of real boxes, taken for agent-box.sh/docs and kept in apps/web/public/screenshots. How each was taken, and which are stale, is in apps/web/images.md.","commands":["# see apps/web/images.md, section 1 (the test environment) and its status table"]}},"topics":["Web hub","Web hub: skills and accounts","Public site","macOS tray","CLI","From the docs"],"scenarios":[{"name":"full","about":"Every state at once: errors, limits, revoked logins, skills in every sync state. For planning and QA."},{"name":"simple","about":"A calm day at Acme: Commerce, two projects, three healthy boxes, two comfortable plans, four skills in sync. For posts and demos."},{"name":"simple-approval","about":"simple, and fix-webhooks asks to run gh pr create."},{"name":"simple-skill-behind","about":"simple, and e2e-playwright changed on studio-mac: the Mac is newer than the Hub."},{"name":"simple-skill-new","about":"simple, and a fifth skill, release-notes, is new on the Hub and not on studio-mac yet."}]};
const { screens, setups, topics, scenarios } = DATA;
const byId = Object.fromEntries(screens.map((s) => [s.id, s]));
/* frame() and FORMATS, from scripts/frame.mjs: the export's own layout. */
/* The social frame: one screen on an AgentBox-branded canvas at a post size.
   `frame()` returns a whole HTML document. `pnpm export` renders it with
   Playwright, and the gallery shows the same document in an iframe as its
   preview (screens.mjs injects this file's source), so what the gallery shows
   is what the export writes. Keep it self-contained: no imports, no closures. */

const FORMATS = {
  "16x9": { w: 1920, h: 1080, use: "X, LinkedIn, YouTube, website" },
  "1x1": { w: 1080, h: 1080, use: "Feed posts" },
  "4x5": { w: 1080, h: 1350, use: "Instagram and LinkedIn portrait feed" },
  "9x16": { w: 1080, h: 1920, use: "Reels, TikTok, Shorts, Stories" },
};

/* src: the image URL; w, h: its pixel size; o.title: an optional headline;
   o.kind: "page" (an opaque full page: rounded card + shadow) or "cutout"
   (a picture with its own transparent edge: a menu, a terminal window);
   o.crop: [x, y, w, h] in image pixels, to show one part of a tall page. */
function frame(src, imgW, imgH, format, o = {}) {
  const [cx, cy, w, h] = o.crop ?? [0, 0, imgW, imgH];
  const F = {
    "16x9": { w: 1920, h: 1080 },
    "1x1": { w: 1080, h: 1080 },
    "4x5": { w: 1080, h: 1350 },
    "9x16": { w: 1080, h: 1920 },
  }[format];
  const pad = Math.round(Math.min(F.w, F.h) * 0.075);
  const titleSize = Math.round(Math.min(F.w, F.h) * (F.w > F.h ? 0.05 : 0.062));
  const titleTop = Math.round(pad * 0.62 + titleSize * 1.05);
  /* Room for the headline as it wraps: ~0.42em per character at this weight (mostly lower case). */
  const lines = o.title ? Math.ceil((String(o.title).length * titleSize * 0.42) / (F.w - pad * 2)) : 0;
  const head = o.title ? Math.round(titleTop + lines * titleSize * 1.12 + pad * 0.35) : Math.round(F.h * 0.08);
  const boxW = F.w - pad * 2;
  const boxH = F.h - head - pad * 1.2;
  const scale = Math.min(boxW / w, boxH / h, o.maxScale ?? 1);
  const dw = Math.round(w * scale);
  const dh = Math.round(h * scale);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const card = o.kind === "cutout"
    ? "filter: drop-shadow(0 18px 40px rgb(22 26 32 / .22));"
    : "border-radius: 14px; box-shadow: 0 0 0 1px rgb(22 26 32 / .08), 0 30px 70px rgb(22 26 32 / .22);";
  return `<!doctype html><meta charset="utf-8"><style>
html, body { margin: 0; }
.c { position: relative; width: ${F.w}px; height: ${F.h}px; overflow: hidden; background: #f4f2ec;
  background-image: radial-gradient(circle at 85% 10%, rgb(18 138 79 / .14), transparent 45%),
    radial-gradient(circle at 5% 95%, rgb(12 107 61 / .10), transparent 40%),
    linear-gradient(rgb(22 26 32 / .045) 1px, transparent 1px), linear-gradient(90deg, rgb(22 26 32 / .045) 1px, transparent 1px);
  background-size: auto, auto, 48px 48px, 48px 48px; font-family: "IBM Plex Sans", -apple-system, "SF Pro Display", system-ui, sans-serif; color: #161a20; }
.brand { position: absolute; left: ${pad}px; top: ${Math.round(pad * 0.62)}px; display: flex; align-items: center; gap: 12px;
  font: 600 ${Math.round(titleSize * 0.55)}px "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -.01em; }
.brand svg { width: ${Math.round(titleSize * 0.8)}px; height: ${Math.round(titleSize * 0.8)}px; }
.title { position: absolute; left: ${pad}px; right: ${pad}px; top: ${titleTop}px;
  font-size: ${titleSize}px; line-height: 1.12; font-weight: 650; letter-spacing: -.02em; }
.shot { position: absolute; left: ${Math.round((F.w - dw) / 2)}px; top: ${Math.round(head + (boxH - dh) / 2 + pad * 0.2)}px;
  width: ${dw}px; height: ${dh}px; ${card} }
</style><div class="c">
<div class="brand"><svg viewBox="0 0 385 382" fill="none"><path d="M325 16H59C35.8 16 17 34.8 17 58V324C17 347.2 35.8 366 59 366H325C348.2 366 367 347.2 367 324V58C367 34.8 348.2 16 325 16Z" fill="#F6F6F3" stroke="#161A20" stroke-width="31"/><path d="M255 191H129V317H255V191Z" stroke="#161A20" stroke-width="10"/><path d="M236 210H148V298H236V210Z" fill="#0C6B3D"/></svg>agentbox</div>
${o.title ? `<div class="title">${esc(o.title)}</div>` : ""}
<div class="shot" style="background: url('${src}') ${-Math.round(cx * scale)}px ${-Math.round(cy * scale)}px / ${Math.round(imgW * scale)}px auto no-repeat"></div>
</div>`;
}

const fileOf = (s, file) => s.files.find((f) => f.file === file);
const src = (file) => screens.flatMap((s) => s.files).find((f) => f.file === file)?.url ?? file;
const repoPath = (file) => screens.flatMap((s) => s.files).find((f) => f.file === file)?.path ?? file;

/* h("div", {class: "x"}, child, "text") */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

const text = (s) =>
  [s.id, s.title, s.topic, s.what, s.url, s.setup, ...(s.usedIn ?? []), ...s.files.map((f) => f.file + " " + (f.state ?? ""))]
    .join(" ")
    .toLowerCase();
/* The scenario filter: "" shows every picture. Remembered per browser. */
let scenario = "";
try {
  scenario = localStorage.getItem("catalog-scenario") ?? "";
} catch {}
if (scenario && !scenarios.some((x) => x.name === scenario)) scenario = "";
const inScenario = (f) => !scenario || f.scenario === scenario;
const shownFiles = (s) => s.files.filter(inScenario);
const matches = (s, q) => shownFiles(s).length > 0 && q.split(/\s+/).every((w) => text(s).includes(w));
/* The picture a card shows: the cover, unless the filter hides it. */
const coverOf = (s) => (inScenario(s.files[s.cover ?? 0]) ? s.files[s.cover ?? 0] : shownFiles(s)[0] ?? s.files[0]);
const picture = (f, alt) => (f.missing ? h("div", { class: "ph" }, f.check ?? "Not taken yet") : h("img", { src: src(f.file), loading: "lazy", alt }));
const badge = (name) => h("span", { class: "badge" + (name.startsWith("simple") ? " simple" : "") }, name);

function card(s) {
  const n = shownFiles(s).length;
  const meta = [n > 1 ? n + " pictures" : null, ...(s.usedIn ?? [])].filter(Boolean).join(" · ");
  const kinds = [...new Set(shownFiles(s).map((f) => f.scenario))];
  return h(
    "button",
    { class: "card", onclick: () => open(s.id) },
    picture(coverOf(s), ""),
    h("span", { class: "t" }, s.title),
    h("span", { class: "m" }, meta || s.topic),
    kinds.length > 1 || (kinds.length === 1 && kinds[0] !== "full") ? h("span", { class: "badges" }, kinds.map(badge)) : null,
  );
}

function topicView(q) {
  const out = [];
  for (const topic of topics) {
    const list = screens.filter((s) => s.topic === topic && matches(s, q));
    if (!list.length) continue;
    out.push(h("h2", {}, topic, h("small", {}, String(list.length))), h("div", { class: "grid" }, list.map(card)));
  }
  return out.length ? out : [h("p", { class: "empty" }, "No screen matches.")];
}

function flowView(q) {
  const kids = (id) => screens.filter((s) => s.from === id);
  const node = (s) => {
    const k = kids(s.id);
    return h(
      "li",
      {},
      h("div", { class: "node" + (k.length ? " kids" : "") + (!matches(s, q) ? " dim" : "") },
        h("div", { class: "via" }, h("span", {}, s.via ?? "")), card(s)),
      k.length ? h("ul", {}, k.map(node)) : null,
    );
  };
  const roots = screens.filter((s) => !s.from);
  return [
    h("p", { class: "empty", style: "padding: 14px 0 0" },
      "Each line is one step: the blue label says what to click or do on the screen to its left."),
    h("div", { class: "flow" }, h("ul", { class: "tree" }, roots.map(node))),
  ];
}

let view = "topic";
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.getElementById("main").replaceChildren(...(view === "flow" ? flowView(q) : topicView(q)));
  for (const v of ["topic", "flow"]) document.getElementById("tab-" + v).setAttribute("aria-pressed", String(view === v));
}

function copyButton(value) {
  const b = h("button", { class: "copy", onclick: () => {
    navigator.clipboard.writeText(value);
    b.textContent = "Copied";
    setTimeout(() => (b.textContent = "Copy"), 1200);
  } }, "Copy");
  return b;
}
const pathRow = (value) => h("div", { class: "path" }, h("code", {}, value), copyButton(value));
const block = (title, lines, code) =>
  lines?.length
    ? [h("h4", {}, title), h(code ? "ol" : "ul", {}, lines.map((l) => h("li", {}, code ? h("pre", {}, l) : l)))]
    : [];
const commands = (title, lines) =>
  lines?.length ? [h("h4", {}, title), h("pre", {}, lines.join("\n"))] : [];

/* The social preview: the export's own frame in an iframe, at each format. */
let format = "16x9";
function social(s, f) {
  if (!f.w) return [];
  const o = { kind: "page", ...(s.social ?? {}) };
  const F = FORMATS[format];
  const box = 400;
  const k = Math.min(box / F.w, box / F.h);
  const doc = frame(f.url, f.w, f.h, format, o);
  const iframe = h("iframe", { srcdoc: doc, scrolling: "no", style: `width:${F.w}px;height:${F.h}px;border:0;transform:scale(${k});transform-origin:0 0;` });
  const cmd = "pnpm export " + s.id + (s.files.length > 1 ? " --file " + s.files.indexOf(f) : "") + " --format " + format;
  return [
    h("h4", {}, "Social"),
    h("div", { class: "crumbs" }, Object.keys(FORMATS).map((k2) =>
      h("button", { "aria-pressed": String(k2 === format), style: k2 === format ? "border-color: var(--brand)" : "",
        onclick: () => { format = k2; draw(); } }, k2 + " · " + FORMATS[k2].w + "×" + FORMATS[k2].h))),
    h("div", { class: "social", style: `width:${Math.round(F.w * k)}px;height:${Math.round(F.h * k)}px` }, iframe),
    h("p", { class: "topic" }, FORMATS[format].use + (o.title ? " · headline: " + o.title : "")),
    pathRow(cmd),
  ];
}

/* The chain of screens from the start of the flow to this one. */
function trail(s) {
  const chain = [];
  for (let x = s; x; x = byId[x.from]) chain.unshift(x);
  return chain;
}

let current = null;
let shown = 0;
function open(id, at) {
  current = byId[id];
  if (!current) return;
  shown = at ?? Math.max(0, current.files.indexOf(coverOf(current)));
  shown = Math.min(shown, current.files.length - 1);
  history.replaceState(null, "", "#" + (view === "flow" ? "flow/" : "") + id);
  draw();
  const dlg = document.getElementById("dlg");
  if (!dlg.open) dlg.showModal();
}

function draw() {
  const s = current;
  const f = s.files[shown];
  const setup = setups[s.setup];
  const chain = trail(s);
  const pic = f.missing
    ? h("div", { class: "pic" }, picture(f, s.title))
    : h("div", { class: "pic fit", title: "Click to switch between fitted and full size",
        onclick: () => pic.classList.toggle("fit") }, h("img", { src: src(f.file), alt: s.title }));
  /* Every picture of the screen, whatever the filter: full and simple side by side. */
  const stage = h("div", { class: "stage" }, pic,
    s.files.length > 1
      ? h("div", { class: "frames" }, s.files.map((x, i) =>
          h("button", { "aria-pressed": String(i === shown), onclick: () => { shown = i; draw(); } },
            x.state ?? x.file.split("/").pop(), " ", badge(x.scenario))))
      : null);

  const info = h("div", { class: "info" },
    h("div", { class: "topic" }, s.topic + " · " + s.id),
    h("h3", {}, s.title),
    s.what ? h("p", {}, s.what) : null,
    f.state ? h("p", {}, h("b", {}, "This state: "), f.state) : null,
    h("p", {}, h("b", {}, "Scenario: "), f.scenario, " · ", scenarios.find((x) => x.name === f.scenario)?.about ?? ""),
    pathRow(repoPath(f.file)),
    s.check ? h("p", { class: "warn" }, s.check) : null,
    f.check ? h("p", { class: "warn" }, f.check) : null,

    h("h4", {}, "How to reach it"),
    chain.length > 1
      ? h("div", { class: "crumbs" }, chain.flatMap((x, i) => [
          i ? h("span", {}, "→ " + (x.via ?? "")) : null,
          h("button", { onclick: () => open(x.id) }, x.title),
        ]))
      : null,
    setup ? h("p", {}, h("b", {}, "Environment: "), setup.title) : null,
    s.url ? pathRow(s.url) : null,
    f.shoot ? h("h4", {}, "Take it again") : null,
    f.shoot ? pathRow(f.shoot) : null,
    ...social(s, f),
    ...block("Changed in the page before the shot", s.edits),
    ...block("Done to the file after the shot", s.post, true),
    ...block("Good to know", s.notes),
    setup
      ? h("details", {}, h("summary", {}, "Start the environment: " + setup.title),
          h("p", {}, setup.what), ...commands("Commands", setup.commands), ...block("Good to know", setup.notes))
      : null,

    ...block("Used in", s.usedIn),
    h("p", { class: "topic", style: "margin-top: 22px" }, "Entry: screens/catalog.mjs, id \"" + s.id + "\""),
  );

  const dlg = document.getElementById("dlg");
  dlg.replaceChildren(h("div", { class: "detail" }, stage, info),
    h("button", { class: "close", "aria-label": "Close", onclick: () => dlg.close() }, "×"));
}

document.getElementById("dlg").addEventListener("close", () => {
  current = null;
  history.replaceState(null, "", view === "flow" ? "#flow" : "#");
});
document.addEventListener("keydown", (e) => {
  if (!current || current.files.length < 2) return;
  const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (!d) return;
  shown = (shown + d + current.files.length) % current.files.length;
  draw();
});
document.getElementById("q").addEventListener("input", render);
const scn = document.getElementById("scn");
scn.replaceChildren(h("option", { value: "" }, "All scenarios"), ...scenarios.map((x) => h("option", { value: x.name, title: x.about }, x.name)));
scn.value = scenario;
scn.addEventListener("change", () => {
  scenario = scn.value;
  try {
    localStorage.setItem("catalog-scenario", scenario);
  } catch {}
  render();
});
for (const v of ["topic", "flow"])
  document.getElementById("tab-" + v).addEventListener("click", () => {
    view = v;
    history.replaceState(null, "", v === "flow" ? "#flow" : "#");
    render();
  });

/* index.html#flow opens the flow, index.html#<id> opens one screen. */
function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash.startsWith("flow")) view = "flow";
  render();
  const id = hash.replace(/^flow\/?/, "");
  if (id) open(id);
}
document.getElementById("count").textContent =
  screens.length + " screens, " + screens.reduce((n, s) => n + s.files.length, 0) + " files";
window.addEventListener("hashchange", route);
route();
</script>
</body>
